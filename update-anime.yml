name: Build full anime appearance database

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install builder dependencies
        run: pip install -r requirements-anime.txt

      - name: Build all Pokémon anime appearances
        run: python tools/build_appearances.py --max-dex 1025

      - name: Commit generated database
        run: |
          git config user.name "pokemon-hub-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/appearances.json
          if git diff --cached --quiet; then
            echo "No database changes."
          else
            git commit -m "Build full anime appearance database"
            git push
          fi
