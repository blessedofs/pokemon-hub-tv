<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pokémon Hub</title>
  <meta name="description" content="Find a Pokémon and jump straight to its anime appearances.">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="index.html" aria-label="Pokémon Hub home">
      <span class="brand-ball" aria-hidden="true"></span>
      <span>Pokémon Hub</span>
    </a>
  </header>

  <main class="home-shell">
    <section class="hero-card">
      <div>
        <p class="eyebrow">Pokémon + Anime</p>
        <h1>Pick a Pokémon.<br>Find its episodes.</h1>
        <p class="hero-copy">
          Search for any Pokémon to open its character page, see the essentials,
          and browse anime appearances with direct watch links.
        </p>

        <form id="pokemonSearch" class="search-box">
          <input id="pokemonInput" autocomplete="off" placeholder="Try Hitmonchan, Gengar, Pikachu..." aria-label="Pokémon name or number">
          <button type="submit">Find Pokémon</button>
        </form>
        <p id="searchError" class="error-text" role="alert"></p>

        <div class="quick-picks">
          <span>Quick picks:</span>
          <a href="pokemon.html?name=hitmonchan">Hitmonchan</a>
          <a href="pokemon.html?name=gengar">Gengar</a>
          <a href="pokemon.html?name=pikachu">Pikachu</a>
          <a href="pokemon.html?name=charizard">Charizard</a>
        </div>
      </div>

      <a class="featured" href="pokemon.html?name=hitmonchan">
        <div class="featured-glow"></div>
        <img
          src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/107.png"
          alt="Hitmonchan">
        <div class="featured-caption">
          <strong>Featured</strong>
          <span>Hitmonchan #107</span>
        </div>
      </a>
    </section>
  </main>

  <script>
    document.getElementById("pokemonSearch").addEventListener("submit", async (event) => {
      event.preventDefault();
      const raw = document.getElementById("pokemonInput").value.trim().toLowerCase();
      const error = document.getElementById("searchError");
      error.textContent = "";
      if (!raw) return;

      const value = raw.replace(/\s+/g, "-");
      try {
        const response = await fetch(`https://pokeapi.co/api/v2/pokemon/${encodeURIComponent(value)}`);
        if (!response.ok) throw new Error();
        const data = await response.json();
        window.location.href = `pokemon.html?name=${encodeURIComponent(data.name)}`;
      } catch {
        error.textContent = "I couldn't find that Pokémon. Try a name or Pokédex number.";
      }
    });
  </script>
</body>
</html>
