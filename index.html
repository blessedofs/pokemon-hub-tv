<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pokémon Hub</title>
  <meta name="description" content="Browse Pokémon and find their anime appearances, episodes, movies, and Pokéflix watch links.">
  <link rel="stylesheet" href="css/style.css">
  <style>
    .landing-banner {
      width: min(1180px, calc(100% - 32px));
      margin: 8px auto 26px;
      border-radius: 28px;
      overflow: hidden;
      border: 1px solid var(--line);
      box-shadow: var(--shadow);
      background: var(--panel);
    }

    .landing-banner img {
      display: block;
      width: 100%;
      height: auto;
      aspect-ratio: 16 / 9;
      object-fit: cover;
    }

    .search-results {
      margin-top: 14px;
      display: none;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: rgba(8, 13, 25, .96);
      overflow: hidden;
      box-shadow: var(--shadow);
    }

    .search-results.active {
      display: block;
    }

    .search-result-group {
      padding: 12px;
      border-top: 1px solid var(--line);
    }

    .search-result-group:first-child {
      border-top: 0;
    }

    .search-result-label {
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: .09em;
      font-size: .7rem;
      font-weight: 900;
      margin: 0 0 8px;
    }

    .search-result {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 11px 12px;
      border-radius: 12px;
      color: var(--text);
      text-decoration: none;
      background: rgba(255,255,255,.035);
      margin-top: 7px;
    }

    .search-result:hover {
      background: rgba(255,255,255,.07);
    }

    .search-result strong {
      display: block;
    }

    .search-result small {
      display: block;
      color: var(--muted);
      margin-top: 3px;
    }

    .search-result-arrow {
      color: var(--accent);
      font-weight: 900;
      flex: 0 0 auto;
    }

    .featured img {
      min-height: 240px;
      object-fit: contain;
    }

    @media (max-width: 650px) {
      .landing-banner {
        border-radius: 20px;
        margin-bottom: 18px;
      }
    }
  
    .search-result-main {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .search-result-thumb {
      width: 52px;
      height: 40px;
      object-fit: cover;
      border-radius: 9px;
      background: rgba(255,255,255,.06);
      flex: 0 0 auto;
    }

    .search-result-pokemon-img {
      width: 46px;
      height: 46px;
      object-fit: contain;
      flex: 0 0 auto;
    }

    .search-result-copy {
      min-width: 0;
    }

    .search-result-copy strong,
    .search-result-copy small {
      overflow: hidden;
      text-overflow: ellipsis;
    }

  </style>
</head>

  <main class="home-shell">
    <section class="hero-card compact-hero">
      <div>
        <p class="eyebrow">Pokémon + Anime</p>
        <h1>Find Pokémon.<br>Find the episode.</h1>
        <p class="hero-copy">
          Search the hub for a Pokémon, anime episode, movie, or special.
        </p>

        <form id="hubSearch" class="search-box">
          <input id="hubSearchInput" autocomplete="off"
                 placeholder="Search Pokémon, episode, or movie..."
                 aria-label="Search Pokémon, episode, or movie">
          <button type="submit">Search Hub</button>
        </form>

        <p id="searchError" class="error-text" role="alert"></p>
        <div id="searchResults" class="search-results" aria-live="polite"></div>
      </div>

      <a class="featured" id="dailyFeaturedLink" href="pokemon.html?name=hitmonchan">
        <div class="featured-glow"></div>
        <img id="dailyFeaturedImage"
             src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/107.png"
             alt="Daily featured Pokémon">
        <div class="featured-caption">
          <strong>Pokémon of the Day</strong>
          <span id="dailyFeaturedName">Hitmonchan #107</span>
        </div>
      </a>
    </section>

    <section class="all-pokemon-section">
      <div class="section-heading home-heading">
        <div>
          <p class="eyebrow">National Pokédex</p>
          <h2>Browse All Pokémon</h2>
        </div>
        <span id="pokemonCount" class="count-pill">Loading…</span>
      </div>

      <div class="dex-controls">
        <input id="dexFilter" type="search" placeholder="Filter Pokémon..." aria-label="Filter Pokémon">
        <select id="generationFilter" aria-label="Filter by generation">
          <option value="all">All generations</option>
          <option value="1">Generation I</option>
          <option value="2">Generation II</option>
          <option value="3">Generation III</option>
          <option value="4">Generation IV</option>
          <option value="5">Generation V</option>
          <option value="6">Generation VI</option>
          <option value="7">Generation VII</option>
          <option value="8">Generation VIII</option>
          <option value="9">Generation IX</option>
        </select>
      </div>

      <div id="pokemonGrid" class="pokemon-grid">
        <div class="status-card">Loading the Pokédex…</div>
      </div>
    </section>
  </main>

  <script>
    const generationRanges = {
      1: [1, 151],
      2: [152, 251],
      3: [252, 386],
      4: [387, 493],
      5: [494, 649],
      6: [650, 721],
      7: [722, 809],
      8: [810, 905],
      9: [906, 2000]
    };

    let allPokemon = [];
    let searchIndex = null;

    const titleCase = (value) =>
      value.split("-").map(part => part.charAt(0).toUpperCase() + part.slice(1)).join(" ");

    const getIdFromUrl = (url) => {
      const match = url.match(/\/pokemon\/(\d+)\//);
      return match ? Number(match[1]) : null;
    };

    function renderGrid() {
      const query = document.getElementById("dexFilter").value.trim().toLowerCase();
      const generation = document.getElementById("generationFilter").value;

      let filtered = allPokemon.filter(p =>
        p.name.includes(query) || String(p.id).includes(query)
      );

      if (generation !== "all") {
        const [min, max] = generationRanges[generation];
        filtered = filtered.filter(p => p.id >= min && p.id <= max);
      }

      const grid = document.getElementById("pokemonGrid");
      document.getElementById("pokemonCount").textContent = `${filtered.length} Pokémon`;

      if (!filtered.length) {
        grid.innerHTML = `<div class="status-card">No Pokémon matched that search.</div>`;
        return;
      }

      grid.innerHTML = filtered.map(p => `
        <a class="pokemon-card" href="pokemon.html?name=${encodeURIComponent(p.name)}">
          <div class="pokemon-card-number">#${String(p.id).padStart(4, "0")}</div>
          <img loading="lazy"
               src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/${p.id}.png"
               alt="${titleCase(p.name)}">
          <strong>${titleCase(p.name)}</strong>
          <span>View anime appearances →</span>
        </a>
      `).join("");
    }

    function setDailyFeatured() {
      if (!allPokemon.length) return;

      const now = new Date();
      const dayKey = Date.UTC(now.getFullYear(), now.getMonth(), now.getDate());
      const dayNumber = Math.floor(dayKey / 86400000);
      const picked = allPokemon[dayNumber % allPokemon.length];

      const link = document.getElementById("dailyFeaturedLink");
      const image = document.getElementById("dailyFeaturedImage");
      const label = document.getElementById("dailyFeaturedName");

      link.href = `pokemon.html?name=${encodeURIComponent(picked.name)}`;
      image.src = `https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/${picked.id}.png`;
      image.alt = `${titleCase(picked.name)} official artwork`;
      label.textContent = `${titleCase(picked.name)} #${picked.id}`;
    }

    async function loadPokemon() {
      try {
        const response = await fetch("https://pokeapi.co/api/v2/pokemon-species?limit=1025&offset=0");
        if (!response.ok) throw new Error();
        const data = await response.json();

        allPokemon = data.results
          .map(p => ({ name: p.name, id: getIdFromUrl(p.url) }))
          .filter(p => p.id && p.id <= 1025);

        renderGrid();
        setDailyFeatured();
      } catch {
        document.getElementById("pokemonGrid").innerHTML =
          `<div class="status-card">The Pokédex couldn't load. Refresh and try again.</div>`;
        document.getElementById("pokemonCount").textContent = "Unavailable";
      }
    }

    async function loadSearchIndex() {
      if (searchIndex) return searchIndex;

      const response = await fetch("data/search-index.json");
      if (!response.ok) throw new Error("Search index unavailable");
      searchIndex = await response.json();
      return searchIndex;
    }

    function renderSearchResults(query, index) {
      const results = document.getElementById("searchResults");
      const q = query.trim().toLowerCase();
      results.innerHTML = "";

      if (!q) {
        results.classList.remove("active");
        return;
      }

      const pokemonMatches = allPokemon
        .filter(p => p.name.includes(q) || String(p.id) === q)
        .slice(0, 6);

      const animeMatches = index
        .filter(item =>
          item.title.toLowerCase().includes(q) ||
          String(item.episode || "").toLowerCase() === q
        )
        .slice(0, 8);

      const episodeMatches = animeMatches.filter(item => item.type === "episode");
      const movieMatches = animeMatches.filter(item => item.type === "movie-special");

      const groups = [];

      if (pokemonMatches.length) {
        groups.push(`
          <div class="search-result-group">
            <p class="search-result-label">Pokémon</p>
            ${pokemonMatches.map(p => `
              <a class="search-result" href="pokemon.html?name=${encodeURIComponent(p.name)}">
                <span class="search-result-main">
                  <img class="search-result-pokemon-img"
                       src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/${p.id}.png"
                       alt="">
                  <span class="search-result-copy">
                    <strong>${titleCase(p.name)}</strong>
                    <small>Pokédex #${String(p.id).padStart(4, "0")}</small>
                  </span>
                </span>
                <span class="search-result-arrow">→</span>
              </a>
            `).join("")}
          </div>
        `);
      }

      if (episodeMatches.length) {
        groups.push(`
          <div class="search-result-group">
            <p class="search-result-label">Episodes</p>
            ${episodeMatches.map(item => `
              <a class="search-result"
                 href="${item.watchUrl || item.searchUrl || "https://www.pokeflix.tv/search/"}"
                 target="_blank" rel="noopener noreferrer">
                <span class="search-result-main">
                  ${item.thumbnail
                    ? `<img class="search-result-thumb" src="${item.thumbnail}" alt="" loading="lazy">`
                    : `<span class="search-result-thumb" style="display:grid;place-items:center;">📺</span>`
                  }
                  <span class="search-result-copy">
                    <strong>${item.title}</strong>
                    <small>${item.episode ? `Episode ${item.episode}` : "Anime episode"} · ${item.pokemon.length} Pokémon connected</small>
                  </span>
                </span>
                <span class="search-result-arrow">↗</span>
              </a>
            `).join("")}
          </div>
        `);
      }

      if (movieMatches.length) {
        groups.push(`
          <div class="search-result-group">
            <p class="search-result-label">Movies & Specials</p>
            ${movieMatches.map(item => `
              <a class="search-result"
                 href="${item.watchUrl || item.searchUrl || "https://www.pokeflix.tv/search/"}"
                 target="_blank" rel="noopener noreferrer">
                <span class="search-result-main">
                  ${item.thumbnail
                    ? `<img class="search-result-thumb" src="${item.thumbnail}" alt="" loading="lazy">`
                    : `<span class="search-result-thumb" style="display:grid;place-items:center;">🎬</span>`
                  }
                  <span class="search-result-copy">
                    <strong>${item.title}</strong>
                    <small>${item.pokemon.length} Pokémon connected</small>
                  </span>
                </span>
                <span class="search-result-arrow">↗</span>
              </a>
            `).join("")}
          </div>
        `);
      }

      if (!groups.length) {
        groups.push(`
          <div class="search-result-group">
            <p class="search-result-label">No matches</p>
            <div class="search-result">
              <span><strong>Nothing found</strong><small>Try a Pokémon name, episode title, or movie title.</small></span>
            </div>
          </div>
        `);
      }

      results.innerHTML = groups.join("");
      results.classList.add("active");
    }

    document.getElementById("hubSearch").addEventListener("submit", async (event) => {
      event.preventDefault();
      const input = document.getElementById("hubSearchInput");
      const error = document.getElementById("searchError");
      const query = input.value.trim();
      error.textContent = "";
      if (!query) return;

      try {
        const index = await loadSearchIndex();
        renderSearchResults(query, index);
      } catch {
        error.textContent = "Search data is still building. Run the anime database workflow once.";
      }
    });

    document.getElementById("hubSearchInput").addEventListener("input", async (event) => {
      const query = event.target.value.trim();
      if (query.length < 2) {
        document.getElementById("searchResults").classList.remove("active");
        return;
      }

      try {
        const index = await loadSearchIndex();
        renderSearchResults(query, index);
      } catch {
        // Submit button will surface the error if needed.
      }
    });

    document.getElementById("dexFilter").addEventListener("input", renderGrid);
    document.getElementById("generationFilter").addEventListener("change", renderGrid);

    loadPokemon();
  </script>
</body>
</html>
